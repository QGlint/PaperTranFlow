[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PaperTranFlow"
version = "0.1.0"
description = "Local CLI-first document parsing, Markdown normalization and translation tool (MinerU + GLM)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
authors = [{ name = "PaperTranFlow contributors" }]
keywords = ["mineru", "translation", "markdown", "pdf", "glm", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL-2.0)",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
# tomli is only needed on Python < 3.11 (3.11+ has tomllib)
toml = ["tomli>=2.0; python_version < '3.11'"]
dev = [
    "pytest>=7.4",
    "pyinstaller>=6.0",
]

[project.scripts]
papertranflow = "cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
