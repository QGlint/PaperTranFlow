# PaperTranFlow 示例配置（不含真实密钥）

# 本文件为可选增强配置，承载非 secret 项。
# secret（MinerU token / GLM key）仍从 <config_dir>/user/MirerU 与 .../user/GLM 读取。

[mineru]
# MinerU 云 API 地址
base_url = "https://mineru.net/api/v4"
model_version = "vlm"
enable_formula = true
# MinerU 识别语言（英文 PDF 建议 "en"）
language = "en"

[glm]
# GLM OpenAI 兼容地址
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-4.7-flash"
temperature = 0.7
top_p = 0.9

[translation]
# 严格串行（不做并发）
concurrency = 1
# 失败重试次数（含限流类错误）
max_retries = 5
# 退避基数（秒）
backoff_base = 2.0
target_lang = "简体中文"
# 两次请求之间的最小间隔（秒）——主动避让 GLM 限流
request_interval = 2.0

[chunking]
target = 5000
hard_limit = 6500

[output]
# 输出文件名后缀（input.md -> input.zh.md）
zh_suffix = ".zh.md"

[image_host]
# 图床上传（默认关闭）。secret 从 <config_dir>/user/CfImage.json 读取：
#   {"base_url": "https://your-cf-image-host.example.com", "token": "..."}
# 开启后上传 out_dir/images 下的图片到图床，并重写 markdown 引用为远程 URL。
enabled = false
